name: Release

on:
  workflow_dispatch:
    inputs:
      version_mode:
        description: 'Version generation mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - manual
      manual_version:
        description: 'Manual version (e.g., 1.0.0) - only used when mode is manual'
        required: false
        type: string
      force_overwrite:
        description: 'Force overwrite existing tag (use with caution)'
        required: false
        default: false
        type: boolean
      version_type:
        description: 'Version type (for auto mode)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      prerelease:
        description: 'Is this a prerelease version'
        required: false
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
          components: rust-src, rustfmt, clippy

      - name: Install build tools
        run: |
          cargo install cargo-binutils
          rustup component add llvm-tools-preview

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-stm32-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-stm32-cargo-

      - name: Validate manual version
        if: github.event.inputs.version_mode == 'manual'
        run: |
          VERSION="${{ github.event.inputs.manual_version }}"

          # Check if version is provided
          if [ -z "$VERSION" ]; then
            echo "❌ Error: Manual version is required when version_mode is 'manual'"
            exit 1
          fi

          # Simple format validation
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "❌ Error: Version '$VERSION' must be in format: major.minor.patch (e.g., 1.0.0)"
            exit 1
          fi

          # Check if tag exists (unless force overwrite is enabled)
          if [ "${{ github.event.inputs.force_overwrite }}" != "true" ] && git tag -l | grep -q "^v$VERSION$"; then
            echo "❌ Error: Tag 'v$VERSION' already exists. Use 'force_overwrite' to replace it."
            exit 1
          fi

          echo "✅ Manual version '$VERSION' is valid"

      - name: Generate semantic version
        id: version
        if: github.event.inputs.version_mode == 'auto'
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "BREAKING CHANGE:"
          minor_pattern: "feat:"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false
          search_commit_body: true
          user_format_type: "csv"
          enable_prerelease_mode: ${{ github.event.inputs.prerelease }}
          debug: false

      - name: Determine final version
        id: final_version
        run: |
          if [ "${{ github.event.inputs.version_mode }}" = "manual" ]; then
            VERSION="${{ github.event.inputs.manual_version }}"
            echo "📝 Using manual version: $VERSION"
          else
            # Use auto-generated version
            if [ "${{ github.event.inputs.version_type }}" = "major" ]; then
              VERSION="${{ steps.version.outputs.major_version }}"
            elif [ "${{ github.event.inputs.version_type }}" = "minor" ]; then
              VERSION="${{ steps.version.outputs.minor_version }}"
            else
              VERSION="${{ steps.version.outputs.version }}"
            fi

            # Simple fallback
            if [ -z "$VERSION" ]; then
              VERSION="0.1.0"
              echo "⚠️ Using fallback version: $VERSION"
            else
              echo "🤖 Using auto-generated version: $VERSION"
            fi
          fi

          # Add prerelease suffix if requested
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            VERSION="${VERSION}-rc.$(date +'%Y%m%d%H%M%S')"
          fi

          echo "version=v$VERSION" >> $GITHUB_OUTPUT
          echo "🎯 Final version: v$VERSION"

      - name: Build release binary
        run: cargo build --release --target thumbv7em-none-eabihf

      - name: Generate binary files
        run: |
          cargo objcopy --release --target thumbv7em-none-eabihf --bin sk150c-kit -- -O binary sk150c-kit.bin
          cargo objcopy --release --target thumbv7em-none-eabihf --bin sk150c-kit -- -O ihex sk150c-kit.hex
          echo "Generated binary files:"
          echo "- sk150c-kit.bin ($(stat -c%s sk150c-kit.bin) bytes)"
          echo "- sk150c-kit.hex ($(stat -c%s sk150c-kit.hex) bytes)"

      - name: Generate changelog
        id: changelog
        run: |
          # Get the last valid release tag (must match v{major}.{minor}.{patch} format)
          LAST_TAG=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -n1)

          echo "## Changes" > CHANGELOG.md
          echo "" >> CHANGELOG.md

          if [ -z "$LAST_TAG" ]; then
            echo "📦 Initial release" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            echo "This is the first release of the SK150C Kit firmware." >> CHANGELOG.md
          else
            echo "📝 Changes since $LAST_TAG:" >> CHANGELOG.md
            echo "" >> CHANGELOG.md

            # Generate commit log since last tag
            COMMITS=$(git log --pretty=format:"- %s (%h)" $LAST_TAG..HEAD)
            if [ -n "$COMMITS" ]; then
              echo "$COMMITS" >> CHANGELOG.md
            else
              echo "- Code optimization and bug fixes" >> CHANGELOG.md
            fi
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "📋 Generated changelog:"
          cat CHANGELOG.md

      - name: Handle existing tag (if force overwrite)
        if: github.event.inputs.force_overwrite == 'true'
        run: |
          TAG="${{ steps.final_version.outputs.version }}"
          if git tag -l | grep -q "^$TAG$"; then
            echo "🗑️ Deleting existing tag: $TAG"
            git tag -d "$TAG" || true
            git push origin ":refs/tags/$TAG" || true
          fi

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.final_version.outputs.version }}
          name: "Release ${{ steps.final_version.outputs.version }}"
          body: |
            🎉 **Official Release**
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Build Information
            - **Build Time:** $(date +'%Y-%m-%d %H:%M:%S UTC')
            - **Commit Hash:** ${{ github.sha }}
            - **Rust Version:** Stable toolchain
            - **Target Architecture:** thumbv7em-none-eabihf (STM32G431CBU6)
            
            ## File Description
            - `sk150c-kit` - Main firmware file (ELF format with debug info)
            - `sk150c-kit.bin` - Binary firmware file for flashing
            - `sk150c-kit.hex` - Intel HEX firmware file for flashing
            
            ## Hardware Requirements
            - **Microcontroller:** STM32G431CBU6
            - **USB PD Interface:** UCPD1 interface support
            - **Power Supply:** USB-C input with PD support
            - **Output Interface:** USB-C output with power control
            
            ## Features
            - USB PD protocol processing (PPS and fixed voltage requests)
            - Voltage/current/temperature monitoring via ADC
            - Power output control with intelligent switching
            - Button input management and status indication
            - Software undervoltage protection
          files: |
            target/thumbv7em-none-eabihf/release/sk150c-kit
            sk150c-kit.bin
            sk150c-kit.hex
          prerelease: ${{ github.event.inputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
